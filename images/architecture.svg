<title id="t">EH3D-NODE-BUNGARD-AUX architecture</title>
<desc id="d">EH3D-NODE-BUNGARD-AUX is firmware in C++17 for an ESP32-S3 with a wired network port, written for ESP-IDF 5.5. It measures the height of the table with a laser (several readings, the odd ones thrown away), reads the speed and the temperature of the spindle, opens a protect output when the spindle is too fast or too hot, and says it all on the network, with the camera as MJPEG, behind a token. The rules and the words of the network are tested on a computer; the firmware, with the drivers of the laser, of the temperature sensors and of the camera (OV2640 or OV5640), builds with ESP-IDF 5.5.5 but has never been flashed or run on a board.</desc>
